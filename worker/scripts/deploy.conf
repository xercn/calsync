# Config for scripts/deploy.sh. Only KEY=VALUE is allowed (not sourced, parsed line by line).
# No secrets here.
NAME=calsync

# Smoke-test URL: GET returns {"ok":true,"version":"<git short SHA>"}. The custom hostname sits entirely behind
# Cloudflare Access, so use the workers.dev address (the server uses it too; /agent/* is key-checked by the Worker itself).
HEALTH_URL=https://calsync.YOUR-SUBDOMAIN.workers.dev/agent/healthz

# Target D1
D1_NAME=calsync
D1_ID=00000000-0000-0000-0000-000000000000

# Read-only query used in the smoke test
SMOKE_SQL=SELECT count(*) AS revs FROM revs

# Optional: macOS Keychain entry (service name) holding a Bark key for deploy notifications; empty = off
BARK_KEYCHAIN=
